# Replace nestra.example.com, then include this server in nginx.conf.
server {
    listen 80;
    server_name nestra.example.com;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl http2;
    server_name nestra.example.com;
    ssl_certificate /etc/letsencrypt/live/nestra.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nestra.example.com/privkey.pem;
    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }
}
