<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{ title or "Nestra" }}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<a class="skip-link" href="#content">Skip to content</a>
<header>
  <a class="brand" href="/">Nestra</a>
  {% if user %}
  <nav aria-label="Main navigation">
    <a href="/subscriptions">Subscriptions</a>
    <a href="/targets">Targets</a>
    <a href="/articles">Articles</a>
    <a href="/settings">Settings</a>
    {% if user.role == "admin" %}<a href="/admin/users">Admin</a>{% endif %}
    <form method="post" action="/logout"><input type="hidden" name="_csrf" value="{{ csrf }}"><button>Log out</button></form>
  </nav>
  {% endif %}
</header>
<main id="content">{% block content %}{% endblock %}</main>
</body>
</html>
