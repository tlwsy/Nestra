{% extends "base.html" %}
{% set title = t("Log in") %}
{% block content %}
<div class="auth-header">
  <div style="display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 12px;">
    <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--accent);" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M7 7h10M7 12h10M7 17h6"/></svg>
    <span style="font-size: 1.3rem; font-weight: 700; letter-spacing: -0.02em; color: var(--text-primary);">Nestra</span>
  </div>
  <h1>{{ t("Log in") }}</h1>
  <p>{{ "自托管智能文章抓取与订阅管理系统" if zh else "Self-hosted article crawling and subscription system" }}</p>
</div>

{% if error %}
<div class="alert alert-danger" style="margin-bottom: 16px;">
  <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
  <span>{{ error }}</span>
</div>
{% endif %}

<form method="post" action="/login" class="stack">
  <input type="hidden" name="_csrf" value="{{ csrf }}">
  <label>{{ t("Username") }}
    <input type="text" name="username" value="{{ username or '' }}" required autocomplete="username" autofocus placeholder="admin">
  </label>
  <label>{{ t("Password") }}
    <input type="password" name="password" required autocomplete="current-password">
  </label>
  <label>{{ t("2FA code") }}
    <input type="text" name="totp" inputmode="numeric" autocomplete="one-time-code" placeholder="{{ '若已启用 2FA 请输入' if zh else 'Optional if not enabled' }}">
  </label>
  <div class="options" style="margin: 4px 0 8px;">
    <label>
      <input type="checkbox" name="remember_me">
      <span>{{ t("Remember me") }}</span>
    </label>
  </div>
  <button type="submit" style="width: 100%; padding: 8px 16px; font-size: var(--text-base);">{{ t("Log in") }}</button>
</form>
{% endblock %}
