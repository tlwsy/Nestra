{% extends "base.html" %}
{% set title = t("Log in") %}
{% block content %}
<h1>{{ t("Log in") }}</h1>
<form method="post" action="/login">
  <input type="hidden" name="_csrf" value="{{ csrf }}">
  <label>{{ t("Username") }} <input name="username" required autocomplete="username"></label>
  <label>{{ t("Password") }} <input type="password" name="password" required autocomplete="current-password"></label>
  <label>{{ t("2FA code") }} <input name="totp" inputmode="numeric" autocomplete="one-time-code"></label>
  <label><input type="checkbox" name="remember_me"> {{ t("Remember me") }}</label>
  <button>{{ t("Log in") }}</button>
</form>
{% endblock %}
