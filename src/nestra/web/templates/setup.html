{% extends "base.html" %}
{% set title = t("Initial setup") %}
{% block content %}
<h1>{{ t("Create the first administrator") }}</h1>
<form method="post" action="/setup">
  <input type="hidden" name="_csrf" value="{{ csrf }}">
  <input type="hidden" name="token" value="{{ setup_token }}">
  <label>{{ t("Username") }} <input name="username" required pattern="[a-z0-9_.-]{1,64}" autocomplete="username"></label>
  <label>{{ t("Password") }} <input type="password" name="password" required minlength="12" maxlength="1024" autocomplete="new-password"></label>
  <button>{{ t("Create administrator") }}</button>
</form>
{% endblock %}
