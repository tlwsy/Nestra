{% extends "base.html" %}
{% set title = t("Initial setup") %}
{% block content %}
<div class="auth-header">
  <div style="display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 12px;">
    <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--accent);" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M7 7h10M7 12h10M7 17h6"/></svg>
    <span style="font-size: 1.3rem; font-weight: 700; letter-spacing: -0.02em; color: var(--text-primary);">Nestra</span>
  </div>
  <h1>{{ t("Create the first administrator") }}</h1>
  <p>{{ "系统初始化向导：设置超级管理员账户凭据" if zh else "System bootstrap: create initial superadmin credentials" }}</p>
</div>

{% if error %}
<div class="alert alert-danger" style="margin-bottom: 16px;">
  <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
  <span>{{ error }}</span>
</div>
{% endif %}

<form method="post" action="/setup" class="stack">
  <input type="hidden" name="_csrf" value="{{ csrf }}">
  <input type="hidden" name="token" value="{{ setup_token }}">
  <label>{{ t("Username") }}
    <input type="text" name="username" value="{{ username or '' }}" required pattern="[a-z0-9_.-]{1,64}" autocomplete="username" autofocus placeholder="admin">
  </label>
  <label>{{ t("Password") }}
    <input type="password" name="password" required minlength="12" maxlength="1024" autocomplete="new-password" placeholder="{{ '至少 12 位高强度密码' if zh else 'At least 12 characters' }}">
  </label>
  <div style="margin-top: 8px;">
    <button type="submit" style="width: 100%; padding: 8px 16px; font-size: var(--text-base);">{{ t("Create administrator") }}</button>
  </div>
</form>
{% endblock %}
