{% extends "base.html" %}
{% set title = t("One-time password") %}
{% block content %}
<div class="page-header">
  <div class="page-header-text">
    <h1>{{ t("One-time password") }}</h1>
  </div>
</div>

<div class="card" style="max-width: 540px; margin-top: 16px;">
  <div class="alert alert-warning" style="margin-bottom: 16px;">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
    <span>{{ t("Copy this password now. It will not be shown again, and the user must change it at first login.") }}</span>
  </div>

  <div style="background: var(--bg-surface-subtle); border: 1px solid var(--border-default); border-radius: var(--radius-sm); padding: 14px 16px; margin-bottom: 20px; text-align: center;">
    <code style="font-size: 1.15rem; font-weight: 600; letter-spacing: 0.05em; user-select: all; color: var(--text-primary);">{{ initial_password }}</code>
  </div>

  <div>
    <a href="/admin/users" class="btn btn-primary" style="text-decoration: none;">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      <span>{{ t("Back to users") }}</span>
    </a>
  </div>
</div>
{% endblock %}
